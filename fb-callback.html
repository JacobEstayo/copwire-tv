<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Social Imperial Poster — Facebook Authorization</title>
<style>
  body { font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; max-width: 680px; margin: 3rem auto; padding: 0 1.25rem; color: #111; line-height: 1.6; text-align: center; }
  code { display: block; word-break: break-all; background: #f2f2f2; border: 1px solid #ddd; border-radius: 8px; padding: 1rem; font-size: 0.95rem; margin: 1rem 0; }
  button { font-size: 1rem; padding: 0.6rem 1.4rem; border-radius: 8px; border: 0; background: #111; color: #fff; cursor: pointer; }
</style>
</head>
<body>
<h1>Social Imperial Poster</h1>
<p id="msg">Reading your authorization…</p>
<code id="codebox" style="display:none"></code>
<button id="copybtn" style="display:none">Copy the code</button>
<p id="hint" style="display:none">Paste this code back to finish connecting Facebook. You can close this tab afterwards.</p>
<script>
  var params = new URLSearchParams(window.location.search);
  var code = params.get('code');
  var error = params.get('error_description') || params.get('error');
  if (code) {
    document.getElementById('msg').textContent = 'Authorization received. Your one-time code:';
    var box = document.getElementById('codebox');
    box.textContent = code;
    box.style.display = 'block';
    var btn = document.getElementById('copybtn');
    btn.style.display = 'inline-block';
    document.getElementById('hint').style.display = 'block';
    btn.addEventListener('click', function () {
      navigator.clipboard.writeText(code).then(function () { btn.textContent = 'Copied'; });
    });
  } else if (error) {
    document.getElementById('msg').textContent = 'Authorization was not completed: ' + error;
  } else {
    document.getElementById('msg').textContent = 'This page is the Facebook sign-in landing for the Social Imperial Poster app. Nothing to do here on its own.';
  }
</script>
</body>
</html>
